name: CI & Static Binary Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  actions: read

jobs:
  test:
    name: Test (${{ matrix.subproject }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        subproject:
          - liblokol
          - cmd/lk
          - cmd/lokol
          - cmd/lokol-mcp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Run tests for ${{ matrix.subproject }}
        run: make -C ${{ matrix.subproject }} test

      - name: Run lint for ${{ matrix.subproject }}
        run: make -C ${{ matrix.subproject }} lint

  build-and-verify:
    name: Verify Build & SBOM
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Verify build across subprojects
        run: make build

      - name: Verify SBOM generation
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: spdx-json
          output-file: lokol-sbom.spdx.json
          upload-artifact: false

  release:
    name: Build & Publish Static Binaries
    needs: [test, build-and-verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact_name: lokol-linux-amd64
          - goos: linux
            goarch: arm64
            artifact_name: lokol-linux-arm64
          - goos: darwin
            goarch: amd64
            artifact_name: lokol-darwin-amd64
          - goos: darwin
            goarch: arm64
            artifact_name: lokol-darwin-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Build static binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LDFLAGS="-s -w \
            -X github.com/boggycreek/lokol/liblokol/version.Version=${TAG_NAME} \
            -X github.com/boggycreek/lokol/liblokol/version.GitCommit=${COMMIT} \
            -X github.com/boggycreek/lokol/liblokol/version.BuildDate=${BUILD_DATE}"
          
          mkdir -p dist/bin
          go build -ldflags "$LDFLAGS" -o "dist/bin/lokol" ./cmd/lokol
          go build -ldflags "$LDFLAGS" -o "dist/bin/lk" ./cmd/lk
          go build -ldflags "$LDFLAGS" -o "dist/bin/lokol-mcp" ./cmd/lokol-mcp
          chmod +x dist/bin/*
          
          # Create compressed tarball containing lokol, lk, and lokol-mcp
          cd dist
          tar -czvf "${{ matrix.artifact_name }}.tar.gz" -C bin lokol lk lokol-mcp
          sha256sum "${{ matrix.artifact_name }}.tar.gz" > "${{ matrix.artifact_name }}.tar.gz.sha256"
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.tar.gz*

  publish:
    name: Create GitHub Release
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: spdx-json
          output-file: lokol-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Flatten release assets
        run: |
          mkdir -p release-assets
          find artifacts/ -type f -name "*.tar.gz*" -exec cp -f {} release-assets/ \;
          cp -f lokol-sbom.spdx.json release-assets/
          cd release-assets
          sha256sum *.tar.gz lokol-sbom.spdx.json > checksums.txt
          sha256sum lokol-sbom.spdx.json > lokol-sbom.spdx.json.sha256
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          prerelease: true
          generate_release_notes: true
          title: "lokol ${{ github.ref_name }} (Alpha)"
